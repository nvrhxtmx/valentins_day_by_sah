<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой подарок скоро!</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            text-align: center;
        }

        .container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            max-width: 90%;
        }

        #countdown {
            font-size: 1.5em;
            margin-top: 10px;
        }

        #giftButton {
        display: block; /* Делаем кнопку блочным элементом */
        margin-top: 20px;
        margin-left: auto; /* Автоматические отступы слева */
        margin-right: auto; /* Автоматические отступы справа */
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        display: none; /* Кнопка изначально скрыта */
    }

        @media (max-width: 600px) {
            #countdown {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>Так, твой подарок будет доступен только 14 февраля!</div>
        <div id="countdown"></div>
        <button id="giftButton" onclick="window.location.href='main.html'">Получить подарок!</button>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date("February 14, 2024 00:00:00").getTime();
            const now = new Date().getTime(); // Уберите симуляцию даты для реального времени!
            const timeLeft = targetDate - now;
            const countdownElement = document.getElementById("countdown");
            const giftButton = document.getElementById("giftButton");

            if (timeLeft <= 0) {
                countdownElement.innerHTML = "Подарок доступен!";
                giftButton.style.display = "block"; // Показываем кнопку
                clearInterval(intervalId); // Останавливаем таймер
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            countdownElement.innerHTML = `До него осталось: ${days} дней, ${hours} часов, ${minutes} минут, ${seconds} секунд`;
        }

        updateCountdown();
        const intervalId = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
